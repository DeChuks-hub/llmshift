# Publishes the public retirement calendar (index.html, retirements.ics, retirements.json)
# to GitHub Pages every day, so "days left" and recently retired models stay current.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: calendar
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths:
      - "src/llmshift/data/**"
      - "src/llmshift/feed.py"
      - ".github/workflows/calendar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check .
      - run: llmshift calendar --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
