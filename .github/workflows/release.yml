name: release
# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed. Uses PyPI trusted
# publishing: no API token is stored anywhere. One-time setup on pypi.org:
# Your account -> Publishing -> add a (pending) publisher with project "llmshift",
# owner "DeChuks-hub", repository "llmshift", workflow "release.yml", environment "pypi".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.15"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false  # nothing here pushes: the token is not left in .git/config
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false  # nothing here pushes: the token is not left in .git/config
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag must match the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          code=$(PYTHONPATH=src python -c "import llmshift; print(llmshift.__version__)")
          if [ "$code" != "$version" ]; then
            echo "::error::src/llmshift/__init__.py says $code but pyproject.toml says $version: llmshift --version would be wrong"
            exit 1
          fi
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the source archive and run its tests, as packagers do
        run: |
          mkdir sdist-check && tar -xzf dist/*.tar.gz -C sdist-check
          python -m venv sdist-venv
          sdist-venv/bin/python -m pip install --quiet dist/*.tar.gz "pytest>=7"
          cd sdist-check/llmshift-* && ../../sdist-venv/bin/python -m pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llmshift/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
