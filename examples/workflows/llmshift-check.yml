# Copy to .github/workflows/llmshift-check.yml
# On every pull request: find the prompts it edits, run only their tests with the edited
# text against the model in production, and comment on the pull request with the result.
name: llmshift check
on:
  pull_request:

jobs:
  prompts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      # Pull requests from forks and Dependabot get no secrets: the check is skipped there instead of failing.
      LLMSHIFT_NO_SECRETS: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base branch is needed to see what the change edits
          persist-credentials: false

      - name: No secrets (a pull request from a fork or Dependabot)
        if: ${{ env.LLMSHIFT_NO_SECRETS == 'true' }}
        run: echo "::notice::The prompt check is skipped - pull requests from forks and Dependabot get no secrets"

      - name: Test the edited prompts
        if: ${{ env.LLMSHIFT_NO_SECRETS != 'true' }}
        uses: DeChuks-hub/llmshift@v0.1.1
        with:
          command: check
          args: --min-pass-rate 0.95
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
