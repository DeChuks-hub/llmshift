# Copy to .github/workflows/llmshift-pr.yml
# On every pull request: fail if the code calls a retired model (with inline annotations on
# retiring ones), then re-run the test set against the model you are moving to.
name: llmshift
on:
  pull_request:
  workflow_dispatch:

jobs:
  llmshift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pull requests from forks and Dependabot get no secrets: the comparison is skipped there instead of failing.
      LLMSHIFT_NO_SECRETS: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false  # nothing here pushes: the token is not left in .git/config

      - name: Retired / retiring models
        uses: DeChuks-hub/llmshift@v0   # or: uses: ./  when this repository is LLMShift itself
        with:
          command: scan
          args: --fail-on retired

      - name: No secrets (a pull request from a fork or Dependabot)
        if: ${{ hashFiles('.llmshift/tests.jsonl') != '' && env.LLMSHIFT_NO_SECRETS == 'true' }}
        run: echo "::notice::The comparison is skipped - pull requests from forks and Dependabot get no secrets"

      - name: Compare the candidate model
        if: ${{ hashFiles('.llmshift/tests.jsonl') != '' && env.LLMSHIFT_NO_SECRETS != 'true' }}
        uses: DeChuks-hub/llmshift@v0
        with:
          command: compare
          args: --to openai:gpt-5.6-sol --min-pass-rate 0.95 --junit llmshift-junit.xml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: llmshift-reports
          path: |
            .llmshift/reports
            llmshift-junit.xml
          if-no-files-found: ignore
