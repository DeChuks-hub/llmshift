# Copy to .github/workflows/llmshift-upgrade.yml
# Every Monday: find models in this repository that are retired or retire soon, swap them
# for their replacement, test the replacement on the recorded traffic and open a pull
# request with the diff and the results ("Dependabot for AI models").
# One-time setup: Settings -> Actions -> General -> Workflow permissions -> tick "Allow
# GitHub Actions to create and approve pull requests" (new repositories have it off).
# Checks on a pull request opened with GITHUB_TOKEN wait until someone with write access
# approves them ("Approve workflows to run"); a personal access token or GitHub App token
# passed as GITHUB_TOKEN starts them right away.
name: llmshift upgrade
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install llmshift

      - name: Open upgrade pull requests
        run: llmshift upgrade --auto --apply --compare --pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
