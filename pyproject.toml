[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "llmshift"
version = "0.1.0"
description = "Switch AI models without breaking your product: find model calls, turn real usage into tests, compare models, fix prompts and watch for drift."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chukwu Nzubechi", email = "nzubechukwu00176@gmail.com" }]
keywords = ["llm", "evals", "openai", "anthropic", "gemini", "testing", "regression", "prompt", "migration", "model-deprecation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML>=5.4",
    "tomli>=1.1.0; python_version < '3.11'",  # reads [tool.llmshift] in pyproject.toml (tomllib is built in from 3.11)
]

[project.urls]
Homepage = "https://github.com/DeChuks-hub/llmshift"
Repository = "https://github.com/DeChuks-hub/llmshift"
Issues = "https://github.com/DeChuks-hub/llmshift/issues"
Changelog = "https://github.com/DeChuks-hub/llmshift/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
llmshift = "llmshift.cli:entry"

[tool.hatch.build.targets.wheel]
packages = ["src/llmshift"]

[tool.hatch.build.targets.sdist]
include = ["src/llmshift", "tests", "examples", "scripts", "README.md", "CHANGELOG.md", "LICENSE", "action.yml", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
